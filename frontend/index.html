<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <script>
      // Motyw przed pierwszym renderem (bez mignięcia) – logika jak w src/app/theme.ts
      ;(function () {
        var pref = null
        try { pref = localStorage.getItem('gp_theme') } catch (e) {}
        var light = pref === 'light' || (pref !== 'dark' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#f3f5f7' : '#0b0f14')
      })()
    </script>
    <title>GymPlanner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
