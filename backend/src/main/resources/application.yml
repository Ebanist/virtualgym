spring:
  application:
    name: gymplanner
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymplanner}
    username: ${DB_USER:gymplanner}
    password: ${DB_PASSWORD:gymplanner}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        max-page-size: 100
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never

springdoc:
  api-docs:
    # 3.0: pola opcjonalne jako `nullable: true` (patrz OpenApiConfig) – prostsze typy w openapi-typescript.
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt:
    # Nadpisz zmienną JWT_SECRET poza środowiskiem lokalnym (min. 32 bajty).
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    # Okno, w którym ponowne użycie zrotowanego tokenu nie jest traktowane jako kradzież (wiele kart).
    refresh-reuse-grace: 30s
    password-reset-ttl: 1h
    secure-cookie: ${SECURE_COOKIE:false}
  storage:
    local-dir: ${STORAGE_DIR:./uploads}
    max-file-size: 5MB
    thumbnail-size: 320
    max-image-dimension: 8000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
