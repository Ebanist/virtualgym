services:
  postgres:
    image: postgres:16-alpine
    container_name: gymplanner-postgres
    environment:
      POSTGRES_DB: gymplanner
      POSTGRES_USER: gymplanner
      POSTGRES_PASSWORD: gymplanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymplanner -d gymplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
